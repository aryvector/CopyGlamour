# Push a tag like v0.2.6.0 (matching <Version> in CopyGlamour.csproj) to build, check, release and update repo.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Dalamud.NET.Sdk builds against the Dalamud files in XIVLauncher's dev folder.
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force

      - name: Parser checks
        run: dotnet run --project Tests -c Release

      - name: Build
        run: dotnet build CopyGlamour.csproj -c Release

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $manifest = Get-Content bin/Release/CopyGlamour/CopyGlamour.json -Raw | ConvertFrom-Json
          if ("v$($manifest.AssemblyVersion)" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match <Version> $($manifest.AssemblyVersion) in CopyGlamour.csproj"
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} bin/Release/CopyGlamour/latest.zip --title ${{ github.ref_name }} --generate-notes

      # Dalamud reads repo.json on every game start and updates the plugin when AssemblyVersion goes up.
      - name: Update repo.json on main
        shell: pwsh
        run: |
          $manifest = Get-Content bin/Release/CopyGlamour/CopyGlamour.json -Raw | ConvertFrom-Json
          $zipUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
          $manifest | Add-Member DownloadLinkInstall $zipUrl
          $manifest | Add-Member DownloadLinkUpdate $zipUrl
          $manifest | Add-Member LastUpdate ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())

          git fetch --depth 1 origin main
          git switch -C main FETCH_HEAD
          ConvertTo-Json -InputObject @($manifest) -Depth 5 | Set-Content repo.json -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "repo.json: ${{ github.ref_name }}"
          git push origin main
